name: Verify installation without Go
on:
  workflow_dispatch:
    inputs:
      service_only:
        description: Run only the systemd maintenance regression
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !inputs.service_only }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: python:3.12-slim-bookworm
    timeout-minutes: 15
    steps:
      - name: Prepare runtime dependencies only
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends curl ca-certificates openssl tzdata
          if command -v go; then echo 'This check requires a Go-free environment.' >&2; exit 1; fi
          if command -v git; then echo 'This check also verifies Git is unnecessary.' >&2; exit 1; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4; REST archive fallback without Git
        with:
          persist-credentials: false
      - name: Download and verify the public release
        run: |
          python scripts/fetch-core.py --output /tmp/nara-core
          /tmp/nara-core/sing-box version
          python -c 'import ctypes; ctypes.CDLL("/tmp/nara-core/libcronet.so")'
      - name: Exercise real proxy traffic and accounting without a compiler
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SING_BOX_TEST_BINARY: /tmp/nara-core/sing-box
        run: |
          pip install -r requirements.txt
          python -m unittest tests.test_core tests.test_auto_apply tests.test_credentials tests.test_panel_update tests.test_warp tests.test_security tests.test_bulk_clients tests.test_rest tests.test_notifications tests.test_audit tests.test_insights -v
          if command -v go; then exit 1; fi
  service-units:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify panel and maintenance service units
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          sudo python3 -m venv /opt/nara-panel/.venv
          sudo /opt/nara-panel/.venv/bin/pip install -r requirements.txt
          systemd-analyze verify deploy/nara-panel.service deploy/nara-panel-access.service deploy/nara-panel-access.path
      - name: Exercise a real systemd panel upgrade with a live WAL database
        run: |
          sudo env GITHUB_ACTIONS=true PYTHONPATH="$GITHUB_WORKSPACE" /opt/nara-panel/.venv/bin/python scripts/verify-service-update.py "$GITHUB_WORKSPACE"
      - name: Read fixture diagnostics on failure
        if: failure()
        run: |
          sudo systemctl show nara-panel-access.service -p User -p CapabilityBoundingSet -p AmbientCapabilities -p NoNewPrivileges -p SecureBits -p PrivateUsers -p SystemCallFilter
          sudo journalctl -u nara-panel-access.service -u nara-panel.service --no-pager -n 100
          sudo test ! -f /var/log/nara-panel-update.log || sudo cat /var/log/nara-panel-update.log

  migration-destination:
    if: ${{ !inputs.service_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated SSH migration verification
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv openssh-client openssh-server
          python3 -m venv /tmp/nara-migration-verifier
          /tmp/nara-migration-verifier/bin/pip install -r requirements.txt
      - name: Migrate through pinned SSH to this fresh disposable VM
        run: |
          sudo env GITHUB_ACTIONS=true PYTHONDONTWRITEBYTECODE=1 /tmp/nara-migration-verifier/bin/python scripts/verify-migration.py "$GITHUB_WORKSPACE"
      - name: Read private fixture diagnostics on failure
        if: failure()
        run: |
          sudo journalctl -u nara-panel --no-pager -n 60
          sudo test ! -f /var/log/nara-migration.log || sudo tail -100 /var/log/nara-migration.log
