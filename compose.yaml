services:
  nara:
    build: .
    image: nara-panel:0.6.2
    init: true
    restart: unless-stopped
    environment:
      NARA_SECURE_COOKIE: "1"
      NARA_SUB_PORT: "10001"
      NARA_SUB_PATH: "/subscriptions"
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      # Add an entry for every inbound.
      - "8443:8443/tcp"
      - "8444:8444/udp"
    volumes:
      - nara-data:/data
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # Use ports >=1024 for inbounds inside the container.
    # The Compose host mapping can expose those ports as 443, 80, etc.

volumes:
  nara-data:
